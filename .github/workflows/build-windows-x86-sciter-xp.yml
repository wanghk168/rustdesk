name: Build Windows x86 Sciter XP

on:
  push:
    branches: [build-windows-x86]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build RustDesk Windows x86 Sciter XP (i686-pc-windows-msvc, windows-2022, x86, x86-windows-static)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job: [x86]
    env:
      TARGET: i686-pc-windows-msvc
      # RUSTFLAGS is intentionally NOT set here; .cargo/config.toml controls the flags for i686-pc-windows-msvc.
      VCPKG_DEFAULT_TRIPLET: x86-windows-static
      VCPKG_s: x86-windows-static
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_ROOT: C:\vcpkg
      # magnum-opus's build.rs hardcodes VCPKG_ROOT\installed\<triplet>.  In manifest
      # mode vcpkg would otherwise install to <repo>\vcpkg_installed, so force the
      # classic installed layout so the Rust build script can find opus headers.
      VCPKG_INSTALLED_DIR: C:\vcpkg\installed
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg and cargo cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg
            C:\Users\runneradmin\AppData\Local\vcpkg
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rustdesk-xp-x86-nasm216-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust x86_64 host toolchain (build scripts run 64-bit, bindgen uses 64-bit libclang)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2023-10-13-x86_64-pc-windows-msvc
          targets: i686-pc-windows-msvc
          components: rust-src

      - name: Add Rust i686 target
        run: |
          rustup target add i686-pc-windows-msvc --toolchain nightly-2023-10-13-x86_64-pc-windows-msvc

      - name: Install NASM (required by aom/vpx)
        uses: ilammy/setup-nasm@v1
        with:
          version: "2.16.01"
          from-source: false

      - name: Install vcpkg dependencies
        run: |
          $env:VCPKG_SSE_ONLY = "1"
          # Replace the broken vcpkg-downloaded nasm with the one we just installed.
          $goodNasm = "C:\Users\runneradmin\nasm\nasm.exe"
          $badNasmDir = "C:\vcpkg\downloads\tools\nasm\nasm-3.01"
          if (Test-Path $badNasmDir) {
            New-Item -ItemType Directory -Force -Path $badNasmDir | Out-Null
            Copy-Item -Force $goodNasm "$badNasmDir\nasm.exe"
          }
          $env:PATH = "C:\Users\runneradmin\nasm;$env:PATH"
          vcpkg integrate install
          # In manifest mode, vcpkg install reads vcpkg.json automatically.
          vcpkg install --triplet x86-windows-static --overlay-ports=${{ github.workspace }}\res\vcpkg

          # magnum-opus, scrap and other crates' build.rs scripts hardcode
          # VCPKG_ROOT\installed\x86-windows-static. In manifest mode vcpkg builds
          # under <repo>\vcpkg_installed, so mirror the entire include tree into
          # the classic path the build scripts expect.
          $manifestInstalled = "${{ github.workspace }}\vcpkg_installed\x86-windows-static"
          $classicInstalled = "C:\vcpkg\installed\x86-windows-static"
          if (Test-Path "$manifestInstalled\include") {
            New-Item -ItemType Directory -Force -Path "$classicInstalled\include" | Out-Null
            Copy-Item -Force -Recurse -Path "$manifestInstalled\include\*" -Destination "$classicInstalled\include"
          }
        shell: pwsh

      - name: Build RustDesk (x86 XP)
        run: |
          $env:VCPKG_SSE_ONLY = "1"
          cargo +nightly-2023-10-13-x86_64-pc-windows-msvc build -Z build-std=std,panic_abort --locked --features inline --release --bins --target i686-pc-windows-msvc
        shell: pwsh

      - name: Package artifact
        run: |
          mkdir -p ${{ github.workspace }}\artifacts
          copy target\i686-pc-windows-msvc\release\rustdesk.exe ${{ github.workspace }}\artifacts\rustdesk-1.4.8-x86-sciter-xp-run${{ github.run_id }}.exe
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-xp-x86-${{ github.run_id }}
          path: ${{ github.workspace }}\artifacts\rustdesk-1.4.8-x86-sciter-xp-run${{ github.run_id }}.exe
