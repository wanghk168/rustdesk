name: Build Windows x86 Sciter XP

on:
  push:
    branches: [build-windows-x86]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build RustDesk Windows x86 Sciter XP (i686-pc-windows-msvc, windows-2022, x86, x86-windows-static)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job: [x86]
    env:
      TARGET: i686-pc-windows-msvc
      RUSTFLAGS: "-Ctarget-feature=+crt-static"
      VCPKG_DEFAULT_TRIPLET: x86-windows-static
      VCPKG_s: x86-windows-static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg and cargo cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg
            C:\Users\runneradmin\AppData\Local\vcpkg
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rustdesk-xp-x86-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust i686 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2023-10-13-i686-pc-windows-msvc
          targets: i686-pc-windows-msvc
          components: rust-src

      - name: Add Rust std target
        run: |
          rustup target add i686-pc-windows-msvc --toolchain nightly-2023-10-13-i686-pc-windows-msvc

      - name: Install vcpkg dependencies
        run: |
          $env:VCPKG_SSE_ONLY = "1"
          vcpkg integrate install
          # In manifest mode, vcpkg install reads vcpkg.json automatically.
          vcpkg install --triplet x86-windows-static --overlay-ports=${{ github.workspace }}\res\vcpkg
        shell: pwsh

      - name: Build RustDesk (x86 XP)
        run: |
          $env:VCPKG_SSE_ONLY = "1"
          cargo +nightly-2023-10-13-i686-pc-windows-msvc build -Z build-std=std,panic_abort --locked --features inline,vram,hwcodec --release --bins --target i686-pc-windows-msvc
        shell: pwsh

      - name: Package artifact
        run: |
          mkdir -p ${{ github.workspace }}\artifacts
          copy target\i686-pc-windows-msvc\release\rustdesk.exe ${{ github.workspace }}\artifacts\rustdesk-1.4.8-x86-sciter-xp-run${{ github.run_id }}.exe
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-xp-x86-${{ github.run_id }}
          path: ${{ github.workspace }}\artifacts\rustdesk-1.4.8-x86-sciter-xp-run${{ github.run_id }}.exe
